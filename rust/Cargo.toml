[workspace]
resolver = "2"
members = ["crates/bb-client", "crates/bb-domain", "crates/bb-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bb-domain = { path = "crates/bb-domain" }
bb-protocol = { path = "crates/bb-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
