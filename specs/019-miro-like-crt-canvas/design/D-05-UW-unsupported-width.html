<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D-05-UW · Unsupported width boundary</title>
<style>
:root{--base:#f8fafc;--raised:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--sky:#0ea5e9;--sky-soft:#f0f9ff;--focus:0 0 0 2px #fff,0 0 0 4px rgba(14,165,233,.5);--shadow:0 1px 2px rgba(15,23,42,.04),0 14px 38px -20px rgba(15,23,42,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--base)}button{font:inherit}.app{min-height:100dvh;width:100%;max-width:100%;overflow-x:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.top{height:64px;flex:0 0 64px;display:flex;align-items:center;padding:0 16px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650}.mark{color:var(--sky);font-size:22px}.context{margin-left:auto;color:var(--muted);font-size:12px}.main{flex:1;display:grid;place-items:center;padding:24px 18px 32px}.card{width:min(100%,354px);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 22px;text-align:left}.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid #bae6fd;border-radius:999px;background:var(--sky-soft);color:#0369a1;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.icon{width:44px;height:44px;display:grid;place-items:center;margin:22px 0 16px;border-radius:12px;background:var(--sky-soft);color:#0369a1;font-size:23px}h1{font-size:25px;line-height:1.18;letter-spacing:-.025em;margin:0 0 12px;overflow-wrap:anywhere}p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 24px}.back{min-height:48px;width:100%;border:1px solid #0284c7;border-radius:10px;background:var(--sky);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}.back:focus-visible{outline:0;box-shadow:var(--focus)}.note{margin:14px 0 0;text-align:center;color:var(--muted);font-size:11px}
@media(min-width:1024px){.card{width:420px}.main{padding:40px}}
</style>
</head>
<body>
<div class="app">
  <header class="top" aria-label="Brain Buddy shell"><div class="brand"><span class="mark" aria-hidden="true">♧</span>Brain Buddy</div><div class="context">Thinking Mode</div></header>
  <main class="main">
    <section class="card" aria-labelledby="unsupported-title">
      <div class="badge"><span aria-hidden="true">↔</span> Wider window required</div>
      <div class="icon" aria-hidden="true">▭</div>
      <h1 id="unsupported-title" tabindex="-1">Thinking Mode needs a wider window</h1>
      <p>Use a window at least 1024 px wide to edit this tree. Your BrainBuddy tasks and saved trees are unchanged.</p>
      <button class="back" type="button">Back to workspace</button>
      <div class="note">The canvas is not loaded at this width.</div>
    </section>
  </main>
</div>
</body>
</html>
