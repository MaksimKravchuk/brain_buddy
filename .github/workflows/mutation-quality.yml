name: Mutation quality (report-only)

# Backend scope is intentionally limited to the deterministic core configured in
# backend/pyproject.toml: app/services/tree_service.py,
# app/services/version_service.py, app/services/relation_service.py,
# app/repositories/tree.py, app/repositories/version.py, and
# app/repositories/index.py.
# LLM/provider, async, and other I/O boundaries are not part of this campaign.
#
# Frontend scope is the deterministic observed tier configured in
# frontend/stryker.config.json: src/api/client.ts, src/api/account.ts,
# src/api/auth.ts, src/api/taskHooks.ts, src/features/tasks/smartAdd.ts,
# src/features/brain-dump/brainDumpNavigation.ts, src/stores/authStore.ts,
# src/utils/error.ts and src/utils/telemetry.ts (ADR-0013). React component
# trees are outside it: a mutant there is as likely to be caught by a snapshot
# as by an assertion, which says nothing about the tests.
#
# Mobile scope is the deterministic core configured in
# mobile/stryker.config.json: src/braindump/machine.ts,
# src/braindump/manifest.ts, src/braindump/uploader.ts,
# src/braindump/waveform.ts, src/lifecycle/guards.ts and
# src/config/serverUrl.ts (ADR-0015). Screens, the hooks that drive them, and
# the device boundaries they stand on are outside it, for the same reason.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-core-mutation:
    name: Deterministic core mutation evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run deterministic-core mutation campaign
        id: mutation
        continue-on-error: true
        run: |
          rm -rf mutants mutation-artifacts mutation-allure-results
          mkdir -p mutation-artifacts
          set +e
          mutmut run
          mutation_exit=$?
          set -e
          # export-cicd-stats writes mutants/mutmut-cicd-stats.json and prints
          # only a "Saved ..." line, so redirecting its stdout captured that
          # sentence instead of the statistics. Copy the file it wrote.
          mutmut export-cicd-stats || true
          cp mutants/mutmut-cicd-stats.json mutation-artifacts/mutation-stats.json || true
          mutmut results > mutation-artifacts/mutation-summary.txt || true
          mutmut results --all true > mutation-artifacts/mutation-survivors.txt || true
          {
            echo "Mutation campaign is report-only; it is not a product-test gate."
            echo "mutmut exit status: ${mutation_exit}"
            cat mutation-artifacts/mutation-summary.txt
          } > mutation-artifacts/mutation-summary.with-status.txt
          mv mutation-artifacts/mutation-summary.with-status.txt mutation-artifacts/mutation-summary.txt
          exit "${mutation_exit}"

      # The enforced tier is what blocks a pull request, and until now nothing
      # scheduled measured it: this campaign's `only_mutate` is the OBSERVED
      # tier, which deliberately carries modules still under calibration and so
      # can never clear 95%. ADR-0004's promotion precondition asks for
      # scheduled evidence "for this unchanged allow-list" and had no producer.
      #
      # It costs nothing to produce. The observed tier is a superset of the
      # enforced six, so the enforced score is a filter over the per-mutant
      # verdicts this run already wrote -- not a second campaign.
      - name: Summarize the enforced tier from the same run
        if: always()
        working-directory: .
        run: |
          python3 scripts/mutation_gate.py summarize-mutmut \
            --results backend/mutation-artifacts/mutation-survivors.txt \
            --enforced backend/mutation-enforced-scope.txt \
            --summary-out backend/mutation-artifacts/enforced-summary.txt \
            --survivors-out backend/mutation-artifacts/enforced-survivors.txt
          {
            echo "### Backend mutation campaign (report-only)"
            echo '```'
            echo "Enforced tier (this is the scope that gates pull requests):"
            cat backend/mutation-artifacts/enforced-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create report-only Allure evidence
        if: always()
        run: |
          mkdir -p mutation-allure-results
          cp mutation-artifacts/mutation-summary.txt mutation-allure-results/
          cp mutation-artifacts/mutation-survivors.txt mutation-allure-results/
          cp mutation-artifacts/enforced-summary.txt mutation-allure-results/
          cp mutation-artifacts/enforced-survivors.txt mutation-allure-results/
          python ../scripts/create_mutation_allure_evidence.py \
            --summary mutation-allure-results/mutation-summary.txt \
            --survivors mutation-allure-results/mutation-survivors.txt \
            --scope-label backend \
            --output mutation-allure-results/mutation-evidence-result.json

      - name: Upload raw mutmut state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-raw-results
          path: backend/mutants
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mutation summary and survivors
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-summary-and-survivors
          path: backend/mutation-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload report-only Allure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-evidence-allure-results
          path: backend/mutation-allure-results
          if-no-files-found: error
          retention-days: 30

      - name: Fail on mutation runner infrastructure errors
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "mutmut could not finish; raw evidence was uploaded for diagnosis." >&2
          exit 1

  frontend-observed-mutation:
    name: Frontend observed-scope mutation evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend observed-scope mutation campaign
        id: mutation
        continue-on-error: true
        run: |
          rm -rf mutation-artifacts .stryker-tmp reports
          npx stryker run

      # Rendered from the same report the gate reads, so the evidence a human
      # looks at and the number a pull request would be judged on cannot drift.
      - name: Summarize observed and enforced scopes
        if: always()
        working-directory: .
        run: |
          mkdir -p frontend/mutation-artifacts frontend/mutation-allure-results
          python3 scripts/mutation_gate.py summarize-stryker \
            --report frontend/mutation-artifacts/mutation-report.json \
            --summary-out frontend/mutation-allure-results/mutation-summary.txt \
            --survivors-out frontend/mutation-allure-results/mutation-survivors.txt
          python3 scripts/mutation_gate.py summarize-stryker \
            --report frontend/mutation-artifacts/mutation-report.json \
            --enforced frontend/mutation-enforced-scope.txt \
            --summary-out frontend/mutation-artifacts/enforced-summary.txt \
            --survivors-out frontend/mutation-artifacts/enforced-survivors.txt
          {
            echo "### Frontend mutation campaign (report-only)"
            echo '```'
            cat frontend/mutation-allure-results/mutation-summary.txt
            echo
            echo "Enforced tier (not yet gating):"
            cat frontend/mutation-artifacts/enforced-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create report-only Allure evidence
        if: always()
        working-directory: .
        run: |
          python3 scripts/create_mutation_allure_evidence.py \
            --summary frontend/mutation-allure-results/mutation-summary.txt \
            --survivors frontend/mutation-allure-results/mutation-survivors.txt \
            --scope-label frontend \
            --output frontend/mutation-allure-results/mutation-evidence-result.json

      - name: Upload frontend mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-mutation-report
          path: frontend/mutation-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload frontend report-only Allure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-mutation-evidence-allure-results
          path: frontend/mutation-allure-results
          if-no-files-found: error
          retention-days: 30

      - name: Fail on mutation runner infrastructure errors
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "Stryker could not finish; raw evidence was uploaded for diagnosis." >&2
          exit 1

  mobile-observed-mutation:
    name: Mobile observed-scope mutation evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Expo SDK 57 requires Node.js 22.13.x or newer.
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mobile observed-scope mutation campaign
        id: mutation
        continue-on-error: true
        run: |
          rm -rf mutation-artifacts .stryker-tmp reports
          npx stryker run

      # Rendered from the same report a gate would read, by the same code that
      # renders the backend's and the frontend's, so the three stacks' scores
      # cannot come to mean different things.
      - name: Summarize the mobile scope
        if: always()
        working-directory: .
        run: |
          mkdir -p mobile/mutation-artifacts mobile/mutation-allure-results
          python3 scripts/mutation_gate.py summarize-stryker \
            --report mobile/mutation-artifacts/mutation-report.json \
            --summary-out mobile/mutation-allure-results/mutation-summary.txt \
            --survivors-out mobile/mutation-allure-results/mutation-survivors.txt
          {
            echo "### Mobile mutation campaign (report-only)"
            echo '```'
            cat mobile/mutation-allure-results/mutation-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create report-only Allure evidence
        if: always()
        working-directory: .
        run: |
          python3 scripts/create_mutation_allure_evidence.py \
            --summary mobile/mutation-allure-results/mutation-summary.txt \
            --survivors mobile/mutation-allure-results/mutation-survivors.txt \
            --scope-label mobile \
            --output mobile/mutation-allure-results/mutation-evidence-result.json

      - name: Upload mobile mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-mutation-report
          path: mobile/mutation-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile report-only Allure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-mutation-evidence-allure-results
          path: mobile/mutation-allure-results
          if-no-files-found: error
          retention-days: 30

      - name: Fail on mutation runner infrastructure errors
        if: steps.mutation.outcome == 'failure'
        run: |
          echo "Stryker could not finish; raw evidence was uploaded for diagnosis." >&2
          exit 1

  mutation-allure-report:
    name: Mutation Allure evidence report
    runs-on: ubuntu-latest
    needs: deterministic-core-mutation
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download report-only Allure evidence
        uses: actions/download-artifact@v8
        with:
          name: mutation-evidence-allure-results
          path: mutation-allure-results

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Allure Report 3 CLI
        working-directory: frontend
        run: npm ci

      - name: Generate report-only Allure HTML
        run: |
          cd frontend
          npx allure generate ../mutation-allure-results -o ../mutation-allure-report

      - name: Upload Allure evidence report
        uses: actions/upload-artifact@v7
        with:
          name: mutation-allure-report-html
          path: mutation-allure-report
          if-no-files-found: error
          retention-days: 30
