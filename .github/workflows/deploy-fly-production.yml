name: Deploy Fly Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check out the CI-tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy backend
        run: flyctl deploy --config fly.backend.toml --remote-only

      - name: Deploy frontend
        run: flyctl deploy --config fly.frontend.toml --remote-only

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          backend_app=$(awk -F"'" '/^app = / { print $2; exit }' fly.backend.toml)
          frontend_app=$(awk -F"'" '/^app = / { print $2; exit }' fly.frontend.toml)

          curl --fail --retry 20 --retry-all-errors --retry-delay 3 \
            "https://${backend_app}.fly.dev/health"
          curl --fail --retry 20 --retry-all-errors --retry-delay 3 \
            "https://${frontend_app}.fly.dev/" >/dev/null

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 20 --retry-all-errors --retry-delay 3 \
            "https://${frontend_app}.fly.dev/api/trees")
          test "$status" = "401"
