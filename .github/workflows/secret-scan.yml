name: Secret scan

# This workflow holds the scan; it does NOT decide when the scan is required.
#
# A trunk candidate lands by pushing `trunk-candidate/<sha>`, and the only
# verdict the default-branch release workflow consumes is CI's `Full CI` join.
# A secret scan running as its own workflow is therefore advisory for the
# landing path: it can be red while `Full CI` is green, and the candidate lands
# anyway. So `ci.yml` calls this workflow as a job inside that required graph
# (see the `secret-scan` job there), which is why the standalone `pull_request`
# and `push` triggers are gone -- keeping them would scan every ref twice for
# one verdict.
#
# `workflow_dispatch` stays: it is the maintainer's full-history sweep.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Determine safe scan range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          null_sha=0000000000000000000000000000000000000000

          # Called from ci.yml, EVENT_NAME is the CALLER's event -- push or
          # pull_request -- so the same two ranges apply. workflow_dispatch is
          # the manual sweep and derives no range at all.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            base="${PUSH_BEFORE}"
          else
            echo "unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi

          # A trunk-candidate/<sha> ref is CREATED by the push that starts its
          # CI run, so `before` is the null SHA and there is no incremental
          # range to derive. Failing here would make the required scan
          # impossible to pass on the one path it must cover, and skipping it
          # would make it a check that never happened; scanning the ref's whole
          # reachable history is the fail-closed reading. It costs about a
          # second on this repository and can never report less than a range
          # scan would.
          if [ "${base}" = "${null_sha}" ]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sha_pattern='^[0-9a-f]{40}$'
          if ! [[ "${base}" =~ ${sha_pattern} && "${EVENT_HEAD}" =~ ${sha_pattern} ]]; then
            echo "event did not provide a safe commit range" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" ||
             ! git cat-file -e "${EVENT_HEAD}^{commit}" ||
             ! git merge-base --is-ancestor "${base}" "${EVENT_HEAD}"; then
            echo "could not verify a safe commit range" >&2
            exit 1
          fi
          echo "mode=range" >> "${GITHUB_OUTPUT}"
          echo "log_opts=${base}..${EVENT_HEAD}" >> "${GITHUB_OUTPUT}"

      - name: Scan changed commit range
        if: steps.range.outputs.mode == 'range'
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks git --redact --verbose --log-opts="${LOG_OPTS}"

      - name: Scan full history
        if: steps.range.outputs.mode == 'full'
        run: gitleaks git --redact --verbose
