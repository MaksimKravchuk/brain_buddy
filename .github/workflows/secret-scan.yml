name: Secret scan

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Determine safe scan range
        if: github.event_name != 'workflow_dispatch'
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            base="${PUSH_BEFORE}"
          else
            echo "unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi

          sha_pattern='^[0-9a-f]{40}$'
          if ! [[ "${base}" =~ ${sha_pattern} && "${EVENT_HEAD}" =~ ${sha_pattern} ]]; then
            echo "event did not provide a safe commit range" >&2
            exit 1
          fi
          if [ "${base}" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${base}^{commit}" ||
             ! git cat-file -e "${EVENT_HEAD}^{commit}" ||
             ! git merge-base --is-ancestor "${base}" "${EVENT_HEAD}"; then
            echo "could not verify a safe commit range" >&2
            exit 1
          fi
          echo "log_opts=${base}..${EVENT_HEAD}" >> "${GITHUB_OUTPUT}"

      - name: Scan changed commit range
        if: github.event_name != 'workflow_dispatch'
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks git --redact --verbose --log-opts="${LOG_OPTS}"

      - name: Scan full history
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git --redact --verbose
