name: Fly Review App (Frontend)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  FLY_APP_PREFIX: ${{ secrets.FLY_APP_PREFIX || 'brain-buddy-frontend-pr' }}
  FLY_ORG: ${{ secrets.FLY_ORG }}
  FLY_REVIEW_BACKEND_ORIGIN: ${{ secrets.FLY_REVIEW_BACKEND_ORIGIN }}
  VITE_API_BASE_URL: /api

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Include design prototype in review app
        run: |
          prototype="docs/design/mobile-first-proposal/prototype.html"
          if [ -f "$prototype" ]; then
            mkdir -p frontend/public/design
            cp "$prototype" frontend/public/design/mobile-first-proposal.html
          fi

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Compose app name
        run: echo "APP_NAME=${FLY_APP_PREFIX}-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Ensure app exists
        run: |
          if ! flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
            create_args=("$APP_NAME")
            if [ -n "$FLY_ORG" ]; then
              create_args+=(--org "$FLY_ORG")
            fi
            flyctl apps create "${create_args[@]}"
          fi

      - name: Configure runtime secrets
        run: |
          if [ -n "$FLY_REVIEW_BACKEND_ORIGIN" ]; then
            flyctl secrets set BACKEND_ORIGIN="$FLY_REVIEW_BACKEND_ORIGIN" -a "$APP_NAME"
          fi

      - name: Deploy review app
        run: |
          deploy_args=(--app "$APP_NAME" --config fly.frontend.toml --remote-only)
          deploy_args+=(--build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL")
          flyctl deploy "${deploy_args[@]}"

      - name: Write review URL
        run: |
          echo "Review app: https://${APP_NAME}.fly.dev" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Compose app name
        run: echo "APP_NAME=${FLY_APP_PREFIX}-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Destroy review app
        run: flyctl apps destroy "$APP_NAME" --yes || true
