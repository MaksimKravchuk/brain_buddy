name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

      - name: Validate Brain Buddy design skill contracts
        run: python3 -m unittest scripts/test_validate_brain_buddy_design_skill.py -v

      - name: Validate mobile privacy evidence scanner
        run: python3 -m unittest scripts/test_validate_mobile_privacy_evidence.py -v

      - name: Validate CI artifact contract
        run: |
          python3 scripts/validate_ci_artifacts.py workflow \
            --ci .github/workflows/ci.yml \
            --frontend-vite-config frontend/vite.config.ts \
            --disallow-workflow frontend/.github/workflows/playwright.yml
          python3 scripts/validate_ci_artifacts.py mutation-workflow \
            --workflow .github/workflows/mutation-quality.yml

  spec-kit:
    name: Spec Kit artifacts
    runs-on: ubuntu-latest
    needs: workflow-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate feature specs
        run: |
          python3 -m unittest scripts/test_check_spec_kit_specs.py -v
          python3 scripts/check_spec_kit_specs.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
    outputs:
      privacy_scan_outcome: ${{ steps.backend_privacy_scan.outcome }}
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Run pytest with coverage and Allure
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml --alluredir=allure-results

      - name: Enforce backend line and branch coverage
        run: python3 ../scripts/validate_backend_coverage.py coverage.xml

      - name: Validate backend Allure results
        if: always()
        working-directory: .
        run: python3 scripts/validate_allure_taxonomy.py --path backend/allure-results --label backend-pytest

      - name: Scan backend Allure evidence for privacy leaks
        id: backend_privacy_scan
        if: always()
        working-directory: .
        run: |
          python3 scripts/validate_mobile_privacy_evidence.py \
            --path backend/allure-results \
            --label backend-evidence

      - name: Upload backend Allure results
        if: steps.backend_privacy_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backend-allure-results
          path: backend/allure-results
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
    outputs:
      privacy_scan_outcome: ${{ steps.frontend_privacy_scan.outcome }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint lint
        run: npm run lint

      - name: Run unit tests with coverage and Allure
        run: npm run test:coverage

      - name: Validate frontend Allure results
        if: always()
        working-directory: .
        run: python3 scripts/validate_allure_taxonomy.py --path frontend/allure-results/vitest --label frontend-vitest

      - name: Scan frontend Allure evidence for privacy leaks
        id: frontend_privacy_scan
        if: always()
        working-directory: .
        run: |
          python3 scripts/validate_mobile_privacy_evidence.py \
            --path frontend/allure-results/vitest \
            --label frontend-evidence

      - name: Upload frontend Allure results
        if: steps.frontend_privacy_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-allure-results
          path: frontend/allure-results/vitest
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend bundle
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
    outputs:
      privacy_scan_outcome: ${{ steps.mobile_privacy_scan.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"

      - name: Install backend contract dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check mobile client
        working-directory: mobile
        run: npm run typecheck

      - name: Lint mobile client
        working-directory: mobile
        run: npm run lint

      - name: Run mobile Jest with Allure
        working-directory: mobile
        run: |
          rm -rf allure-results
          npm test

      - name: Validate mobile Allure results
        if: always()
        run: python3 scripts/validate_allure_taxonomy.py --path mobile/allure-results --label mobile-jest

      - name: Verify committed OpenAPI semantic and generated-client drift
        run: |
          cd backend
          source .venv/bin/activate
          python -m scripts.openapi_snapshot check --snapshot ../mobile/api/openapi.json
          cd ../mobile
          npm run api:generate
          git diff --exit-code -- api/openapi.json src/api/openapi.generated.ts

      - name: Verify Expo SDK dependencies
        working-directory: mobile
        run: npx expo install --check && npx expo-doctor

      - name: Export Expo web bundle
        working-directory: mobile
        run: npx expo export --platform web

      - name: Scan publishable mobile evidence for privacy leaks
        id: mobile_privacy_scan
        if: always()
        working-directory: mobile
        run: |
          python3 ../scripts/validate_mobile_privacy_evidence.py \
            --path dist \
            --path allure-results \
            --path logs \
            --path screenshots \
            --path crash-artifacts \
            --path build \
            --label mobile-evidence

      - name: Verify Expo CNG prebuild for iOS and Android
        working-directory: mobile
        run: |
          temp_mobile="$(mktemp -d)/mobile"
          trap 'rm -rf "${temp_mobile%/mobile}"' EXIT
          cp -a . "$temp_mobile"
          (
            cd "$temp_mobile"
            npx expo prebuild --platform ios --no-install
            rm -rf ios android
            npx expo prebuild --platform android --no-install
          )
          test ! -d ios
          test ! -d android

      - name: Upload mobile Allure results
        if: steps.mobile_privacy_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-allure-results
          path: mobile/allure-results
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            docker build -t brain-buddy-backend-test -f backend/Dockerfile . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

      - name: Build frontend image
        run: |
          for attempt in 1 2 3; do
            docker build -t brain-buddy-frontend-test -f frontend/Dockerfile . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

  e2e:
    name: Compose Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    outputs:
      privacy_scan_outcome: ${{ steps.playwright_privacy_scan.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Compose smoke and Playwright E2E
        run: |
          # make test-e2e invokes npm run test:e2e after the Compose stack is ready.
          make test-e2e

      - name: Validate Playwright Allure results
        if: always()
        run: |
          python3 scripts/validate_ci_artifacts.py results --path frontend/allure-results/playwright --label playwright-e2e --since-file frontend/allure-results/playwright/.run-started-at
          python3 scripts/validate_ci_artifacts.py product-e2e-results --path frontend/allure-results/playwright

      - name: Scan Playwright Allure evidence for privacy leaks
        id: playwright_privacy_scan
        if: always()
        run: |
          python3 scripts/validate_mobile_privacy_evidence.py \
            --path frontend/allure-results/playwright \
            --label playwright-evidence

      - name: Upload Playwright Allure results
        if: steps.playwright_privacy_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-allure-results
          path: frontend/allure-results/playwright
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: frontend/playwright-report
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright failure artifacts and Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 30

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - mobile
      - e2e
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require explicit privacy scan success for all layers
        if: needs.backend.outputs.privacy_scan_outcome != 'success' || needs.frontend.outputs.privacy_scan_outcome != 'success' || needs.e2e.outputs.privacy_scan_outcome != 'success' || needs.mobile.outputs.privacy_scan_outcome != 'success'
        run: |
          echo "::error::One or more layer privacy scans did not explicitly succeed (backend=${{ needs.backend.outputs.privacy_scan_outcome }}, frontend=${{ needs.frontend.outputs.privacy_scan_outcome }}, playwright=${{ needs.e2e.outputs.privacy_scan_outcome }}, mobile=${{ needs.mobile.outputs.privacy_scan_outcome }}); refusing to download, generate, upload, or publish the aggregate Allure report (ADR-0008)." >&2
          exit 1

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true

      - name: Validate aggregate Allure results
        run: python3 scripts/validate_allure_taxonomy.py --path allure-results --label aggregate-allure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Allure Report 3 CLI
        working-directory: frontend
        run: npm ci

      - name: Generate Allure Report 3 HTML
        run: |
          cd frontend
          npx allure generate ../allure-results -o ../allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report
          if-no-files-found: error
          retention-days: 30

      - name: Post PR Allure report link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- brain-buddy-allure-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nAllure Report 3 HTML artifact: [allure-report-html](${runUrl}) (retained for 30 days).`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
      - backend
      - frontend
      - mobile
      - docker
      - e2e
      - allure-report
    if: always()
    steps:
      - name: Require successful CI, Docker, E2E, and Allure report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
          echo "Full CI passed."
