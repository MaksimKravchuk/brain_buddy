name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

      - name: Validate CI artifact contract
        run: |
          python3 scripts/validate_ci_artifacts.py workflow \
            --ci .github/workflows/ci.yml \
            --frontend-vite-config frontend/vite.config.ts \
            --disallow-workflow frontend/.github/workflows/playwright.yml
          python3 scripts/validate_ci_artifacts.py mutation-workflow \
            --workflow .github/workflows/mutation-quality.yml

  spec-kit:
    name: Spec Kit artifacts
    runs-on: ubuntu-latest
    needs: workflow-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate feature specs
        run: |
          python3 -m unittest scripts/test_check_spec_kit_specs.py -v
          python3 scripts/check_spec_kit_specs.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Run pytest with coverage and Allure
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml --alluredir=allure-results

      - name: Enforce backend line and branch coverage
        run: python3 ../scripts/validate_backend_coverage.py coverage.xml

      - name: Validate backend Allure results
        if: always()
        working-directory: .
        run: python3 scripts/validate_ci_artifacts.py results --path backend/allure-results --label backend-pytest

      - name: Upload backend Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-allure-results
          path: backend/allure-results
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint lint
        run: npm run lint

      - name: Run unit tests with coverage and Allure
        run: npm run test:coverage

      - name: Validate frontend Allure results
        if: always()
        working-directory: .
        run: python3 scripts/validate_ci_artifacts.py results --path frontend/allure-results/vitest --label frontend-vitest

      - name: Upload frontend Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-allure-results
          path: frontend/allure-results/vitest
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend bundle
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            docker build -t brain-buddy-backend-test -f backend/Dockerfile . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

      - name: Build frontend image
        run: |
          for attempt in 1 2 3; do
            docker build -t brain-buddy-frontend-test -f frontend/Dockerfile . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

  native-product-e2e:
    name: Native Product Compose E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: brainbuddy-native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      BRAIN_BUDDY_ENV: development
      BRAIN_BUDDY_PORT: 8000
      FRONTEND_PORT: 8080
      VITE_API_BASE_URL: /api
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start isolated Compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose ps

      - name: Run native tasks and Voice Brain Dump E2E
        working-directory: frontend
        run: npm run test:e2e:compose

      - name: Validate native product E2E Allure results
        if: always()
        run: |
          python3 scripts/validate_ci_artifacts.py results --path frontend/allure-results/playwright --label native-product-e2e
          python3 scripts/validate_ci_artifacts.py product-e2e-results --path frontend/allure-results/playwright

      - name: Upload native product E2E Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-product-e2e-allure-results
          path: frontend/allure-results/playwright
          if-no-files-found: error
          retention-days: 30

      - name: Upload native product E2E Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-product-e2e-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload native product E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-product-e2e-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Dump Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop isolated Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - native-product-e2e
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true

      - name: Validate aggregate Allure results
        run: python3 scripts/validate_ci_artifacts.py results --path allure-results --label aggregate-allure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Allure Report 3 CLI
        working-directory: frontend
        run: npm ci

      - name: Generate Allure Report 3 HTML
        run: |
          cd frontend
          npx allure generate ../allure-results -o ../allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report
          if-no-files-found: error
          retention-days: 30

      - name: Post PR Allure report link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- brain-buddy-allure-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nAllure Report 3 HTML artifact: [allure-report-html](${runUrl}) (retained for 30 days).`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
      - backend
      - frontend
      - docker
      - native-product-e2e
      - allure-report
    if: always()
    steps:
      - name: Require successful CI, Docker, and Allure report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
          echo "Full CI passed."
