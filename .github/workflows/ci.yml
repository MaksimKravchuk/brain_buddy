name: CI

on:
  push:
    # trunk-candidate/** refs run the same required full CI as main. This
    # workflow definition is candidate-controlled (it runs from the pushed
    # ref), so it deliberately holds NO write permission and never promotes:
    # landing (fast-forwarding main) is owned exclusively by the
    # default-branch deploy-fly-production.yml workflow, which consumes this
    # run's completion via workflow_run (ADR-0008). A candidate that edits
    # this file therefore cannot grant itself the power to land.
    branches: ["main", "trunk-candidate/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Cancel a superseded pull_request run so a new push to the same PR does not
# keep paying for stale runs. The group falls back to github.ref for push
# events, and cancel-in-progress is false there, so main push CI is never
# cancelled by a later push queuing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

      - name: Validate Brain Buddy design skill contracts
        run: python3 -m unittest scripts/test_validate_brain_buddy_design_skill.py -v

      - name: Validate CI artifact contract
        run: |
          python3 scripts/validate_ci_artifacts.py workflow \
            --ci .github/workflows/ci.yml \
            --frontend-vite-config frontend/vite.config.ts \
            --disallow-workflow frontend/.github/workflows/playwright.yml
          python3 scripts/validate_ci_artifacts.py mutation-workflow \
            --workflow .github/workflows/mutation-quality.yml
          python3 scripts/validate_ci_artifacts.py preview-workflow \
            --workflow .github/workflows/fly-review-frontend.yml

      - name: Validate verified-trunk delivery contract
        run: |
          python3 -m unittest scripts/test_validate_trunk_delivery.py -v
          python3 -m unittest scripts/test_submit_to_trunk.py -v
          python3 -m unittest scripts/test_production_smoke.py -v
          python3 -m unittest scripts/test_capture_fly_release_image.py -v
          python3 -m unittest scripts/test_classify_path_risk.py -v
          python3 -m unittest scripts/test_check_smoke_identity_cohort.py -v
          python3 scripts/validate_trunk_delivery.py trunk-ci \
            --ci .github/workflows/ci.yml
          python3 scripts/validate_trunk_delivery.py deploy \
            --workflow .github/workflows/deploy-fly-production.yml

  # Which stacks a pull request actually touches. Every stack job still RUNS --
  # it just skips its expensive steps when nothing relevant changed. Skipping
  # the jobs themselves would produce a 'skipped' result, and ADR-0008 requires
  # Full CI to treat that as a failure so a candidate can never land on the
  # strength of a check that did not happen. A job that runs, finds nothing to
  # do, and succeeds keeps that guarantee intact.
  #
  # Filtering applies to pull requests only. Pushes to main and to
  # trunk-candidate/** are the landing path, and those are verified in full.
  changes:
    name: Changed stacks
    runs-on: ubuntu-latest
    needs: workflow-lint
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      mobile: ${{ steps.decide.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed stacks
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'Makefile'
              - 'docker-compose*.yml'
            backend:
              - *shared
              - 'backend/**'
            frontend:
              - *shared
              - 'frontend/**'
            # Mobile also runs on backend changes: its integration suite is the
            # only check that exercises the backend<->mobile wire protocol
            # (chunk hashing and the byte-identical manifest hash), so a
            # backend-only change that breaks that contract must not slip past.
            mobile:
              - *shared
              - 'mobile/**'
              - 'backend/**'

      - name: Decide which stacks to exercise
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            backend='${{ steps.filter.outputs.backend }}'
            frontend='${{ steps.filter.outputs.frontend }}'
            mobile='${{ steps.filter.outputs.mobile }}'
          else
            # Landing path: verify everything regardless of the diff.
            backend=true
            frontend=true
            mobile=true
          fi
          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "mobile=${mobile}"
          } >> "$GITHUB_OUTPUT"
          echo "backend=${backend} frontend=${frontend} mobile=${mobile}"

  spec-kit:
    name: Spec Kit artifacts
    runs-on: ubuntu-latest
    needs: workflow-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate feature specs
        run: |
          python3 -m unittest scripts/test_check_spec_kit_specs.py -v
          python3 scripts/check_spec_kit_specs.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
      - changes
    # The job always runs; RUN gates its expensive steps. See the `changes` job
    # for why this is not a job-level `if`.
    env:
      RUN: ${{ needs.changes.outputs.backend }}
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.RUN == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        if: env.RUN == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Report-only while the existing advisory backlog is worked down through
      # Dependabot. Findings land in the run summary so they stay visible
      # instead of scrolling past in the log.
      - name: Audit Python dependencies
        if: env.RUN == 'true'
        continue-on-error: true
        run: |
          pip install pip-audit
          {
            echo "### Backend dependency audit"
            echo '```'
            pip-audit --progress-spinner off 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff lint
        if: env.RUN == 'true'
        run: ruff check app tests

      # Never checked in CI before, so 33 of 145 files had drifted out of
      # black's format despite black being the documented formatter.
      - name: Format check
        if: env.RUN == 'true'
        run: black --check app tests

      - name: Type check
        if: env.RUN == 'true'
        run: mypy app

      # Architectural fitness functions: the layering documented in CLAUDE.md is
      # enforced here rather than left to review.
      - name: Import contracts
        if: env.RUN == 'true'
        run: lint-imports

      - name: Run pytest with coverage and Allure
        if: env.RUN == 'true'
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml --alluredir=allure-results

      - name: Enforce backend line and branch coverage
        if: env.RUN == 'true'
        run: python3 ../scripts/validate_backend_coverage.py coverage.xml

      - name: Validate backend Allure results
        if: always() && env.RUN == 'true'
        working-directory: .
        run: python3 scripts/validate_allure_taxonomy.py --path backend/allure-results --label backend-pytest

      - name: Upload backend Allure results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-allure-results
          path: backend/allure-results
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload coverage artifact
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
      - changes
    env:
      RUN: ${{ needs.changes.outputs.frontend }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.RUN == 'true'
        run: npm ci

      # Report-only, same rationale as the backend audit step.
      - name: Audit npm dependencies
        if: env.RUN == 'true'
        continue-on-error: true
        run: |
          {
            echo "### Frontend dependency audit"
            echo '```'
            npm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ESLint lint
        if: env.RUN == 'true'
        run: npm run lint

      - name: Run unit tests with coverage and Allure
        if: env.RUN == 'true'
        run: npm run test:coverage

      - name: Validate frontend Allure results
        if: always() && env.RUN == 'true'
        working-directory: .
        run: python3 scripts/validate_allure_taxonomy.py --path frontend/allure-results/vitest --label frontend-vitest

      - name: Upload frontend Allure results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-allure-results
          path: frontend/allure-results/vitest
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Build frontend bundle
        if: env.RUN == 'true'
        run: npm run build

      - name: Upload coverage artifact
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - spec-kit
      - changes
    env:
      RUN: ${{ needs.changes.outputs.mobile }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires Node.js 22.13.x or newer.
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: env.RUN == 'true'
        run: npm ci

      # Report-only, same rationale as the backend audit step.
      - name: Audit npm dependencies
        if: env.RUN == 'true'
        continue-on-error: true
        run: |
          {
            echo "### Mobile dependency audit"
            echo '```'
            npm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check
        if: env.RUN == 'true'
        run: npm run typecheck

      - name: Run unit tests
        if: env.RUN == 'true'
        run: npm test

      - name: Set up Python for the integration backend
        if: env.RUN == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend for the integration suite
        if: env.RUN == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Boots a disposable backend (BRAIN_BUDDY_ENV=test, deterministic AI
      # providers) and drives the real mobile API client through signup, the
      # task lifecycle, and the full brain-dump chunk/manifest protocol.
      - name: Run integration suite against a disposable backend
        if: env.RUN == 'true'
        run: npm run integration

      - name: Verify Metro bundle export
        if: env.RUN == 'true'
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform ios

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - changes
    env:
      RUN: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.RUN == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: env.RUN == 'true'
        run: |
          for attempt in 1 2 3; do
            docker build -t brain-buddy-backend-test -f backend/Dockerfile . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

      - name: Build frontend image
        if: env.RUN == 'true'
        run: |
          for attempt in 1 2 3; do
            docker build -t brain-buddy-frontend-test -f frontend/Dockerfile . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

  e2e:
    name: Compose Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Compose smoke and Playwright E2E
        run: |
          # make test-e2e invokes npm run test:e2e after the Compose stack is ready.
          make test-e2e

      - name: Validate Playwright Allure results
        if: always()
        run: |
          python3 scripts/validate_ci_artifacts.py results --path frontend/allure-results/playwright --label playwright-e2e --since-file frontend/allure-results/playwright/.run-started-at
          python3 scripts/validate_ci_artifacts.py product-e2e-results --path frontend/allure-results/playwright

      - name: Upload Playwright Allure results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-allure-results
          path: frontend/allure-results/playwright
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Playwright HTML report
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: frontend/playwright-report
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Playwright failure artifacts and Compose logs
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - e2e
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true

      - name: Validate aggregate Allure results
        run: python3 scripts/validate_allure_taxonomy.py --path allure-results --label aggregate-allure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Allure Report 3 CLI
        working-directory: frontend
        run: npm ci

      - name: Generate Allure Report 3 HTML
        run: |
          cd frontend
          npx allure generate ../allure-results -o ../allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Post PR Allure report link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- brain-buddy-allure-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nAllure Report 3 HTML artifact: [allure-report-html](${runUrl}) (retained for 30 days).`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - changes
      - spec-kit
      - backend
      - frontend
      - mobile
      - docker
      - e2e
      - allure-report
    if: always()
    steps:
      - name: Require successful CI, Docker, E2E, and Allure report
        run: |
          # A skipped required job must fail too: with `if: always()` here, a
          # skipped dependency would otherwise let Full CI pass vacuously.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required CI jobs failed, were cancelled, or were skipped." >&2
            exit 1
          fi
          echo "Full CI passed."
