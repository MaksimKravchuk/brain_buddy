name: iOS

# The native iOS app (docs/native-ios-app.md, ios/README.md). Kept out of
# ci.yml: it runs only when ios/ changes, it is not a landing-required check,
# and on main it publishes to TestFlight once both build jobs have passed.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    # trunk-candidate/** so a PR-less SHIP/SHOW landing (ADR-0008) gets iOS
    # evidence before it reaches main. Only main ever uploads (see testflight).
    branches: ["main", "trunk-candidate/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer push to a pull request cancels the stale run; push
# runs are never cancelled mid-flight (that could interrupt an upload), a newer
# one queues behind the running one instead.
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit-linux:
    name: Kit on Linux (Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ios/BrainBuddyKit
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show the toolchain
        run: swift --version

      - name: Build the package
        run: swift build

      - name: Test the package
        run: swift test --parallel

  app-macos:
    name: App on macOS (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select the newest Xcode 26
        run: bash ios/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      # Unsigned: this proves the app, the widget extension and the package
      # compile together. The raw log is kept for the failure artifact; the
      # console gets xcbeautify's annotations when the runner has it.
      - name: Build app and widgets for the iOS Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project BrainBuddy.xcodeproj \
            -scheme BrainBuddy \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -resultBundlePath "${RUNNER_TEMP}/BrainBuddy.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 \
            | tee "${RUNNER_TEMP}/xcodebuild.log" \
            | if command -v xcbeautify >/dev/null 2>&1; then xcbeautify --renderer github-actions; else cat; fi

      - name: Test the package on macOS
        working-directory: ios/BrainBuddyKit
        run: swift test --parallel

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-macos-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/BrainBuddy.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Signs with automatic, cloud-managed signing through an App Store Connect
  # API key and uploads the archive. Until the owner configures the
  # `testflight` environment the job reports what is missing and stays green.
  # Restrict that environment to the `main` branch (ios/README.md): the
  # branch policy, not this `if`, is what keeps the key away from other refs.
  testflight:
    name: Upload to TestFlight
    needs: [kit-linux, app-macos]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: testflight
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check the TestFlight configuration
        id: config
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID_PREFIX: ${{ vars.IOS_BUNDLE_ID_PREFIX }}
          BUILD_NUMBER_OFFSET: ${{ vars.IOS_BUILD_NUMBER_OFFSET }}
        run: |
          missing=()
          [ -n "${API_KEY_ID}" ] || missing+=("secret APP_STORE_CONNECT_API_KEY_ID")
          [ -n "${API_ISSUER_ID}" ] || missing+=("secret APP_STORE_CONNECT_API_ISSUER_ID")
          [ -n "${API_KEY_P8}" ] || missing+=("secret APP_STORE_CONNECT_API_KEY_P8")
          [ -n "${APPLE_TEAM_ID}" ] || missing+=("variable APPLE_TEAM_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### TestFlight upload skipped"
              echo
              echo "TestFlight upload skipped: configure the following in the \`testflight\` environment, then re-run this workflow on main (see \`ios/README.md\`, TestFlight):"
              echo
              printf -- '- %s\n' "${missing[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::notice title=TestFlight upload skipped::Configure ${missing[*]} (ios/README.md, TestFlight)."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Present but malformed is a mistake, not "not set up yet": fail.
          if ! [[ "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Apple team id."
            exit 1
          fi
          if [ -n "${BUNDLE_ID_PREFIX}" ] && ! [[ "${BUNDLE_ID_PREFIX}" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::IOS_BUNDLE_ID_PREFIX must be a reverse-DNS prefix such as com.example."
            exit 1
          fi
          offset="${BUILD_NUMBER_OFFSET:-0}"
          if ! [[ "${offset}" =~ ^[0-9]+$ ]]; then
            echo "::error::IOS_BUILD_NUMBER_OFFSET must be a non-negative integer."
            exit 1
          fi

          echo "build-number=$((GITHUB_RUN_NUMBER + 10#${offset}))" >> "${GITHUB_OUTPUT}"
          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7.0.1

      - name: Select the newest Xcode 26
        if: steps.config.outputs.configured == 'true'
        run: bash ios/scripts/select-xcode.sh

      - name: Install XcodeGen
        if: steps.config.outputs.configured == 'true'
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        if: steps.config.outputs.configured == 'true'
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Install the App Store Connect API key
        if: steps.config.outputs.configured == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key_dir="${RUNNER_TEMP}/private_keys"
          mkdir -p "${key_dir}"
          chmod 700 "${key_dir}"
          key_path="${key_dir}/AuthKey_${API_KEY_ID}.p8"
          (umask 077 && printf '%s\n' "${API_KEY_P8}" > "${key_path}")
          chmod 600 "${key_path}"

      - name: Archive for the App Store (Release)
        if: steps.config.outputs.configured == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID_PREFIX: ${{ vars.IOS_BUNDLE_ID_PREFIX }}
          BUILD_NUMBER: ${{ steps.config.outputs.build-number }}
        run: |
          overrides=("DEVELOPMENT_TEAM=${APPLE_TEAM_ID}" "CURRENT_PROJECT_VERSION=${BUILD_NUMBER}")
          if [ -n "${BUNDLE_ID_PREFIX}" ]; then
            overrides+=("BB_BUNDLE_ID_PREFIX=${BUNDLE_ID_PREFIX}")
          fi
          xcodebuild archive \
            -project ios/BrainBuddy.xcodeproj \
            -scheme BrainBuddy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/BrainBuddy.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}" \
            "${overrides[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/xcodebuild-archive.log" \
            | if command -v xcbeautify >/dev/null 2>&1; then xcbeautify --renderer github-actions; else cat; fi

      - name: Export and upload to App Store Connect
        if: steps.config.outputs.configured == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          options="${RUNNER_TEMP}/ExportOptions.plist"
          cp ios/ci/ExportOptions.plist "${options}"
          plutil -replace teamID -string "${APPLE_TEAM_ID}" "${options}"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/BrainBuddy.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${options}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}" 2>&1 \
            | tee "${RUNNER_TEMP}/xcodebuild-export.log"

      - name: Summarize the upload
        if: steps.config.outputs.configured == 'true'
        run: |
          plist="${RUNNER_TEMP}/BrainBuddy.xcarchive/Info.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:$1" "${plist}"; }
          {
            echo "### Uploaded to TestFlight"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Bundle id | \`$(read_key CFBundleIdentifier)\` |"
            echo "| Version | \`$(read_key CFBundleShortVersionString)\` |"
            echo "| Build | \`$(read_key CFBundleVersion)\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo "App Store Connect processes the build before it appears in TestFlight."
          } >> "${GITHUB_STEP_SUMMARY}"

      # xcodebuild echoes its command line, key id and issuer id included, into
      # the logs. Those are masked in the console but not inside an artifact.
      - name: Redact API key identifiers from the logs
        if: failure() && steps.config.outputs.configured == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          for log in "${RUNNER_TEMP}"/xcodebuild-*.log; do
            [ -f "${log}" ] || continue
            sed -i '' -e "s|${API_KEY_ID}|[key id]|g" -e "s|${API_ISSUER_ID}|[issuer id]|g" "${log}"
          done

      - name: Upload archive logs
        if: failure() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the API key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/private_keys"
