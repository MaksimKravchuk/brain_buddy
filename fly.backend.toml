# fly.toml app configuration file generated for brain-buddy-backend on 2025-12-16T22:48:12+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'brain-buddy-backend'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  BRAIN_BUDDY_API_KEY_HEADER = 'X-API-Key'
  BRAIN_BUDDY_API_PREFIX = '/api'
  BRAIN_BUDDY_ENV = 'production'
  BRAIN_BUDDY_PUBLIC_BASE_URL = 'https://brain-buddy-backend.fly.dev'
  # Voice Brain Dump provider roles (ADR-0008). Non-secret selection only; the
  # credentials come from the DEEPGRAM_API_KEY / OPENAI_API_KEY Fly secrets via
  # each role's api_key_env default. Models are pinned rather than inherited so
  # a default change in config.py cannot silently move production. A missing
  # credential degrades the role to disabled (fail closed), it does not fail
  # startup.
  BRAIN_BUDDY_VOICE_ACCURATE_STT_MODEL = 'nova-3'
  BRAIN_BUDDY_VOICE_ACCURATE_STT_PROVIDER = 'deepgram'
  BRAIN_BUDDY_VOICE_RECONCILER_MODEL = 'gpt-4o'
  BRAIN_BUDDY_VOICE_RECONCILER_PROVIDER = 'openai'

[[mounts]]
  source = 'brain_buddy_data'
  destination = '/app/data'

[[services]]
  internal_port = 8000
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
