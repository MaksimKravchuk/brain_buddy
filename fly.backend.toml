app = "brain-buddy-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  BRAIN_BUDDY_ENV = "production"
  BRAIN_BUDDY_API_PREFIX = "/api"
  BRAIN_BUDDY_API_KEY_HEADER = "X-API-Key"

[[mounts]]
  source = "brain_buddy_data"
  destination = "/app/data"
  size_gb = 1
  region = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    name = "tcp"
    type = "tcp"
    interval = "15s"
    timeout = "2s"

  [[http_service.checks]]
    name = "health"
    type = "http"
    interval = "15s"
    timeout = "5s"
    method = "get"
    path = "/health"
