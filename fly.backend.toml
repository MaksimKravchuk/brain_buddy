# fly.toml app configuration file generated for brain-buddy-backend on 2025-12-16T22:48:12+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'brain-buddy-backend'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  BRAIN_BUDDY_API_KEY_HEADER = 'X-API-Key'
  BRAIN_BUDDY_API_PREFIX = '/api'
  BRAIN_BUDDY_ENV = 'production'

[[mounts]]
  source = 'brain_buddy_data'
  destination = '/app/data'

[[services]]
  internal_port = 8000
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
