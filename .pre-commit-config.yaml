repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        additional_dependencies: ["click==8.1.7"]
  # Matches the range pinned in backend/pyproject.toml so the hook and CI apply
  # the same rules. `ruff-format` is deliberately absent: black is this repo's
  # formatter, and running both means whichever hook goes last wins, so they
  # rewrite each other's output. At these versions ruff-format disagrees with
  # black on 35 files.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: ["fastapi", "pydantic"]
