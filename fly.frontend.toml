# Fly configuration for the Brain Buddy frontend. Deploy after the backend so
# VITE_API_BASE_URL can target the correct Fly app hostname.
app = "brain-buddy-frontend"
primary_region = "iad"

[build]
  dockerfile = "frontend/Dockerfile"
  [build.args]
    # Replace backend app name if it differs; this value feeds the Vite build.
    VITE_API_BASE_URL = "https://brain-buddy-backend.fly.dev/api"
    VITE_API_KEY = ""
    VITE_API_KEY_HEADER = "X-API-Key"

[env]
  # Keep in sync with the backend Fly app name to avoid CORS/base URL mismatches.
  VITE_API_BASE_URL = "https://brain-buddy-backend.fly.dev/api"
  VITE_API_KEY_HEADER = "X-API-Key"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200
