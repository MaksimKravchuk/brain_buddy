<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation shadows" subtitle="inset · soft · raised · floating · glow" viewport="700x150" -->
<html><head><meta charset="utf-8"><title>Shadows</title>
<style>
  body{margin:0;padding:20px;background:#f8fafc;font-family:Inter,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;height:84px;display:flex;align-items:end;justify-content:center;padding-bottom:8px;font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em}
  .c1{box-shadow:inset 0 1px 0 rgba(15,23,42,.08)}
  .c2{box-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03)}
  .c3{box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12)}
  .c4{box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -16px rgba(15,23,42,.18)}
  .c5{box-shadow:0 16px 32px rgba(14,165,233,.18);border-color:transparent;outline:2px solid rgba(14,165,233,.3)}
</style></head><body>
<div class="grid">
  <div class="card c1">inset</div>
  <div class="card c2">soft</div>
  <div class="card c3">raised</div>
  <div class="card c4">floating</div>
  <div class="card c5">glow</div>
</div>
</body></html>
