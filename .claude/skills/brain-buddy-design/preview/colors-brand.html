<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Primary sky-500, lighter hover, indigo accent, sky glow" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#f8fafc;font-family:Inter,sans-serif}
  .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border:1px solid #e2e8f0;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04)}
  .chip{height:60px}
  .meta{padding:10px 12px}
  .name{font-size:12px;font-weight:600;color:#0f172a;letter-spacing:-0.005em}
  .hex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#64748b;margin-top:2px}
  .role{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#94a3b8;margin-top:4px}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#0ea5e9"></div><div class="meta"><div class="name">Brand primary</div><div class="hex">#0EA5E9 · sky-500</div><div class="role">Primary</div></div></div>
  <div class="sw"><div class="chip" style="background:#38bdf8"></div><div class="meta"><div class="name">Primary hover</div><div class="hex">#38BDF8 · sky-400</div><div class="role">Hover (lighter)</div></div></div>
  <div class="sw"><div class="chip" style="background:#6366f1"></div><div class="meta"><div class="name">Brand secondary</div><div class="hex">#6366F1 · indigo-500</div><div class="role">Accent</div></div></div>
  <div class="sw"><div class="chip" style="background:rgba(14,165,233,0.18);border-bottom:1px solid #e2e8f0"></div><div class="meta"><div class="name">Sky glow</div><div class="hex">sky-500 @ 18%</div><div class="role">Selection halo</div></div></div>
</div>
</body></html>
