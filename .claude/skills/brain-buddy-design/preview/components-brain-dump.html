<!doctype html>
<!-- @dsCard group="Components" name="Brain dump patterns" subtitle="Pulsing mic, rec timer, live transcript caret, forming task, waveform" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Brain dump patterns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;padding:20px 24px;background:#f8fafc;font-family:Inter,sans-serif;font-feature-settings:"cv11","ss01","ss03";-webkit-font-smoothing:antialiased;color:#0f172a}
  a{color:#0ea5e9}a:hover{color:#38bdf8}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:#64748b;margin:0 0 8px}
  .grid{display:grid;grid-template-columns:auto 1fr;gap:18px 24px;align-items:center;max-width:640px}
  @keyframes bbPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2);opacity:0}}
  @keyframes bbBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes bbBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  @keyframes bbShimmer{0%{background-position:-260px 0}100%{background-position:260px 0}}
  .mic{position:relative;width:44px;height:44px}
  .mic .ring{position:absolute;inset:0;border-radius:999px;background:rgba(14,165,233,.16);animation:bbPulse 1.8s cubic-bezier(.22,1,.36,1) infinite}
  .mic .btn{position:absolute;inset:0;border-radius:999px;background:#0ea5e9;color:#fff;display:flex;align-items:center;justify-content:center}
  .rec{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#e11d48;font-weight:500}
  .rec .d{width:7px;height:7px;border-radius:999px;background:#e11d48}
  .tr{font-size:13px;line-height:1.4;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr b{color:#475569;font-weight:400}
  .caret{display:inline-block;width:2px;height:13px;background:#0ea5e9;margin-left:2px;vertical-align:text-bottom;animation:bbBlink 1.1s step-end infinite}
  .forming{padding:11px 14px;border:1px dashed #cbd5e1;border-radius:10px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(241,245,249,0) 0,rgba(255,255,255,.9) 50%,rgba(241,245,249,0) 100%),#f8fafc;background-size:260px 100%;background-repeat:no-repeat;animation:bbShimmer 1.6s linear infinite;font-size:14px;font-weight:500}
  .forming span{font-size:11px;color:#94a3b8;font-weight:400;margin-left:auto}
  .wave{display:flex;align-items:flex-end;gap:3px;height:24px}
  .wave i{width:4px;height:18px;border-radius:2px;background:#0ea5e9;transform-origin:bottom;animation:bbBar 1s cubic-bezier(.22,1,.36,1) infinite}
  .wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
  .safety{font-size:12px;color:#94a3b8}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<p class="lbl">The only ambient motion in the product</p>
<div class="grid">
  <div class="mic"><span class="ring"></span><span class="btn"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span></div>
  <div><span class="rec"><span class="d"></span>01:24</span><div class="safety" style="margin-top:4px">Nothing is saved until you stop</div></div>
  <div class="wave"><i></i><i></i><i></i><i></i></div>
  <div class="tr">…take the car in before the weekend. For the launch post, <b>maybe AI can draft it and I'll review it on Thursday</b><span class="caret"></span></div>
  <div style="font-size:11px;color:#94a3b8">forming card</div>
  <div class="forming">Cancel unused SaaS subscriptions<span>forming…</span></div>
</div>
</body></html>
