<!doctype html>
<!-- @dsCard group="Components" name="Dropdown menu" subtitle="Tree menu trigger + floating menu with section header" viewport="700x380" -->
<html><head><meta charset="utf-8"><title>Dropdown menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;padding:24px;background:#f8fafc;font-family:Inter,sans-serif;color:#0f172a}
  .menu{width:280px;background:rgba(255,255,255,.95);border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -16px rgba(15,23,42,.18);padding:4px;backdrop-filter:blur(8px)}
  .item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px;color:#334155;cursor:pointer}
  .item:hover{background:#f1f5f9;color:#0f172a}
  .item.danger{color:#be123c}.item.danger:hover{background:#fff1f2}
  .sep{height:1px;background:#e2e8f0;margin:4px 0}
  .sec{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;font-weight:600;padding:6px 12px 4px}
  .sub{font-size:11px;color:#94a3b8}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .trig{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;font-weight:600;margin-bottom:10px;font-size:15px;letter-spacing:-0.01em}
  .trig .sprout{color:#0ea5e9}
</style></head><body>

<div class="trig">
  <svg class="sprout" viewBox="0 0 24 24">
    <path d="M7 20h10"/>
    <path d="M10 20c5.5-2.5.8-6.4 3-10"/>
    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/>
    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9.1 3.3-.2 4.3-.9 1-.6 1.9-1.8 2.7-3.6-2.4-.5-4-.3-5-.1-.4.1-.7.3-.9.6z"/>
  </svg>
  Supply chain CRT
  <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
</div>

<div class="menu">
  <div class="item">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    New tree
  </div>
  <div class="item">
    <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    Rename tree
  </div>
  <div class="item">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    Export to file
  </div>
  <div class="item">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    Import from file
  </div>
  <div class="item danger">
    <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    Delete tree
  </div>
  <div class="sep"></div>
  <div class="sec">Switch tree</div>
  <div class="item"><div><div style="font-size:14px">Pricing assumptions</div><div class="sub" style="margin-top:2px">Updated 4m ago</div></div></div>
  <div class="item"><div><div style="font-size:14px">Onboarding friction</div><div class="sub" style="margin-top:2px">Updated 2h ago</div></div></div>
</div>

</body></html>
