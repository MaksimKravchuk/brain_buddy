<!doctype html>
<!-- @dsCard group="Colors" name="Slate neutrals" subtitle="The full slate scale — the entire neutral palette" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Colors — Neutrals</title>
<style>
  body{margin:0;padding:20px;background:#f8fafc;font-family:Inter,sans-serif}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .sw{border-radius:8px;overflow:hidden;border:1px solid #e2e8f0;background:#fff}
  .chip{height:52px}
  .meta{padding:6px 8px}
  .name{font-size:10px;font-weight:600;color:#0f172a}
  .hex{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#64748b}
  h3{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:600;margin:0 0 8px}
</style></head><body>
<h3>Slate scale — the entire neutral palette</h3>
<div class="row">
  <div class="sw"><div class="chip" style="background:#f8fafc"></div><div class="meta"><div class="name">50</div><div class="hex">F8FAFC</div></div></div>
  <div class="sw"><div class="chip" style="background:#f1f5f9"></div><div class="meta"><div class="name">100</div><div class="hex">F1F5F9</div></div></div>
  <div class="sw"><div class="chip" style="background:#e2e8f0"></div><div class="meta"><div class="name">200</div><div class="hex">E2E8F0</div></div></div>
  <div class="sw"><div class="chip" style="background:#cbd5e1"></div><div class="meta"><div class="name">300</div><div class="hex">CBD5E1</div></div></div>
  <div class="sw"><div class="chip" style="background:#94a3b8"></div><div class="meta"><div class="name">400</div><div class="hex">94A3B8</div></div></div>
  <div class="sw"><div class="chip" style="background:#64748b"></div><div class="meta"><div class="name" style="color:#fff;background:#64748b;margin:-6px -8px 0;padding:6px 8px">500</div><div class="hex">64748B</div></div></div>
  <div class="sw"><div class="chip" style="background:#475569"></div><div class="meta"><div class="name">600</div><div class="hex">475569</div></div></div>
  <div class="sw"><div class="chip" style="background:#334155"></div><div class="meta"><div class="name">700</div><div class="hex">334155</div></div></div>
  <div class="sw"><div class="chip" style="background:#1e293b"></div><div class="meta"><div class="name">800</div><div class="hex">1E293B</div></div></div>
  <div class="sw"><div class="chip" style="background:#0f172a"></div><div class="meta"><div class="name">900</div><div class="hex">0F172A</div></div></div>
</div>
</body></html>
