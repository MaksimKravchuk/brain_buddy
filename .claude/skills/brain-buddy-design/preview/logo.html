<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Sprout mark across surfaces + wordmark lockup" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;padding:24px;background:#f8fafc;font-family:Inter,sans-serif;color:#0f172a;display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sq{width:80px;height:80px;border-radius:18px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12)}
  .dark{background:#0f172a;border-color:#0f172a}
  .brand{background:#0ea5e9;border-color:#0ea5e9}
  .lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .lock{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:-0.02em}
</style></head><body>

<!-- Mark: a causality tree — one root node branching into two children, bottom node (undesired effect) emphasized in brand primary. -->
<div class="b">
  <div class="sq">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <path d="M22 13 L12 26" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 13 L32 26" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 26 L22 34" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 26 L22 34" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="10" r="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="12" cy="26" r="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="32" cy="26" r="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="22" cy="36" r="5" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="2"/>
    </svg>
  </div>
  <div class="lbl">Mark · on light</div>
</div>

<div class="b">
  <div class="sq dark">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <path d="M22 13 L12 26" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 13 L32 26" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 26 L22 34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 26 L22 34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="10" r="4" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
      <circle cx="12" cy="26" r="4" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
      <circle cx="32" cy="26" r="4" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
      <circle cx="22" cy="36" r="5" fill="#38bdf8" stroke="#38bdf8" stroke-width="2"/>
    </svg>
  </div>
  <div class="lbl">On dark</div>
</div>

<div class="b">
  <div class="sq brand">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <path d="M22 13 L12 26" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 13 L32 26" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 26 L22 34" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 26 L22 34" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="10" r="4" fill="#0ea5e9" stroke="#fff" stroke-width="2"/>
      <circle cx="12" cy="26" r="4" fill="#0ea5e9" stroke="#fff" stroke-width="2"/>
      <circle cx="32" cy="26" r="4" fill="#0ea5e9" stroke="#fff" stroke-width="2"/>
      <circle cx="22" cy="36" r="5" fill="#fff" stroke="#fff" stroke-width="2"/>
    </svg>
  </div>
  <div class="lbl">Reversed</div>
</div>

<!-- Monogram alternate: 'BB' overlapped as two linked nodes. -->
<div class="b">
  <div class="sq">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <path d="M16 14 L16 30" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M16 14 L23 14 a5 5 0 0 1 0 10 L16 24" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M16 22 L24 22 a5 5 0 0 1 0 10 L16 32 L16 22" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="32" cy="30" r="3" fill="#0ea5e9"/>
    </svg>
  </div>
  <div class="lbl">Monogram</div>
</div>

<!-- Full horizontal lockup -->
<div class="b">
  <div class="lock">
    <svg width="28" height="28" viewBox="0 0 44 44" fill="none">
      <path d="M22 13 L12 26" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22 13 L32 26" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M12 26 L22 34" stroke="#0ea5e9" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M32 26 L22 34" stroke="#0ea5e9" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="22" cy="10" r="3.8" fill="#fff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="12" cy="26" r="3.8" fill="#fff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="32" cy="26" r="3.8" fill="#fff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="22" cy="36" r="4.6" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="2"/>
    </svg>
    <span>Brain Buddy</span>
  </div>
  <div class="lbl">Horizontal lockup</div>
</div>

</body></html>
