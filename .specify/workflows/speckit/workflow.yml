schema_version: "1.0"
workflow:
  id: "speckit"
  name: "BrainBuddy Portable Spec Review"
  version: "3.0.0"
  author: "BrainBuddy"
  description: "Portable spec review gate (ADR-0011): five read-only reviewer lenses fan out over the feature planning artifacts and fan in to one schema-validated verdict. Runs for every feature, in Claude Code or Codex, with or without a managed outcome."

requires:
  speckit_version: ">=0.14.2"

inputs:
  # Unknown risk is medium, never low. Derivation from the planning artifacts
  # can only RAISE this class: at review time there is no diff, so all it can
  # see is which paths are mentioned, and a mention is not a change. Lowering
  # to `low` is an accountable operator declaration here.
  risk:
    type: string
    default: "medium"
    enum: ["low", "medium", "high"]
    prompt: "Planning risk class: low, medium or high (default medium)"
  # There is deliberately NO human_signoff input. A caller-controlled boolean
  # lets the same automated actor that runs the campaign self-certify the human
  # gate on exactly the ASK-class surfaces the gate protects. High-risk sign-off
  # is a separate run-bound record at
  # .specify/workflows/runs/<run-id>/human-signoff.json, validated against the
  # run id and a digest of the reviewed artifacts.

steps:
  - id: planning-preflight
    type: shell
    run: >-
      python3 scripts/spec_kit_planning_review.py preflight
      --run-id "{{ context.run_id }}"

  - id: planning-reviews
    type: fan-out
    items:
      - "requirements-consistency"
      - "architecture-consistency"
      - "testability-evidence"
      - "privacy-consent-security"
      - "ux-accessibility-mobile"
    max_concurrency: 5
    step:
      id: run-read-only-review
      type: shell
      run: >-
        python3 scripts/spec_kit_planning_review.py review
        --run-id "{{ context.run_id }}"
        --role "{{ item }}"

  - id: high-risk-review
    type: if
    condition: "{{ inputs.risk == 'high' }}"
    then:
      - id: run-fable-adversarial-review
        type: shell
        run: >-
          python3 scripts/spec_kit_planning_review.py review
          --run-id "{{ context.run_id }}"
          --role "adversarial-high-risk"
    else: []

  - id: collect-reviews
    type: fan-in
    wait_for: ["planning-reviews", "high-risk-review"]
    output:
      campaign_statuses: "{{ fan_in.results }}"

  - id: summarize-reviews
    type: shell
    run: >-
      python3 scripts/spec_kit_planning_review.py summarize
      --run-id "{{ context.run_id }}"
