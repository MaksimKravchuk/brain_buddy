schema_version: "1.0"
workflow:
  id: "speckit"
  name: "BrainBuddy Architect Planning Review"
  version: "2.0.0"
  author: "BrainBuddy"
  description: "Historical bounded planning review retained for compatibility; opt-in managed outcomes may use spec-driven-kanban per ADR-0010"

requires:
  speckit_version: ">=0.14.2"

inputs:
  risk:
    type: string
    default: "standard"
    enum: ["standard", "high"]
    prompt: "Planning risk: standard or high"

steps:
  - id: planning-preflight
    type: shell
    run: >-
      python3 scripts/spec_kit_planning_review.py preflight
      --run-id "{{ context.run_id }}"

  - id: planning-reviews
    type: fan-out
    items:
      - "requirements-consistency"
      - "architecture-consistency"
      - "testability-evidence"
    max_concurrency: 3
    step:
      id: run-read-only-review
      type: shell
      run: >-
        python3 scripts/spec_kit_planning_review.py review
        --run-id "{{ context.run_id }}"
        --role "{{ item }}"

  - id: high-risk-review
    type: if
    condition: "{{ inputs.risk == 'high' }}"
    then:
      - id: run-fable-adversarial-review
        type: shell
        run: >-
          python3 scripts/spec_kit_planning_review.py review
          --run-id "{{ context.run_id }}"
          --role "adversarial-high-risk"
    else: []

  - id: collect-reviews
    type: fan-in
    wait_for: ["planning-reviews", "high-risk-review"]
    output:
      campaign_statuses: "{{ fan_in.results }}"

  - id: summarize-reviews
    type: shell
    run: >-
      python3 scripts/spec_kit_planning_review.py summarize
      --run-id "{{ context.run_id }}"
