schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Spec Kit Planning Cycle"
  version: "1.0.0"
  author: "GitHub + BrainBuddy"
  description: "Runs specify → clarify → plan → checklist → tasks, then stops for Hermes Kanban handoff"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # BrainBuddy intentionally uses Spec Kit for authoring/planning only.
    # Implement commands are not referenced here; implementation resumes only
    # through Hermes Kanban cards, isolated worktrees, PR review, and CI gates.
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "requirements quality and implementation readiness for {{ inputs.spec }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: kanban-handoff
    type: gate
    message: "Stop here. Open or update Hermes Kanban implementation cards from tasks.md; do not execute implementation in this Spec Kit workflow."
    options: [handoff-recorded, abort]
    on_reject: abort
