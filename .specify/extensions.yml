# BrainBuddy first-party stage chaining for Spec Kit.
#
# This is NOT a third-party Spec Kit extension install. `docs/spec-kit-workflow.md`
# forbids `specify extension update` and community extensions; this file is
# repository-local configuration that the v0.15.0 skills already read. It adds
# no new runtime, no scheduler, and no upstream dependency.
#
# Every one of the ten speckit skills checks `hooks.before_<stage>` and
# `hooks.after_<stage>` here. Chaining stages through this file is what lets us
# add the interview, design, review, acceptance and report stages WITHOUT
# forking a single upstream skill body.
#
# `optional: true`  -> the skill prints the suggestion and continues.
# `optional: false` -> the skill emits EXECUTE_COMMAND and waits for the result.
#
# Command ids use dots; the skills translate `speckit.review` -> `/speckit-review`.

hooks:
  # Optional on purpose. /speckit-interview is the human front door and it
  # invokes /speckit-specify itself once the business requirements are agreed.
  # Registering it as mandatory here would make specify call interview call
  # specify, forever.
  before_specify:
    - extension: brainbuddy-pipeline
      command: speckit.interview
      optional: true
      description: "Elicit business requirements from the human before writing the spec."
      prompt: >-
        No intake.md exists for this feature. Run /speckit-interview first to
        capture the problem, persona, business objective, scope boundary,
        non-goals, constraints and definition of done, then let it call
        /speckit-specify with the agreed description.

  # Design is load-bearing: the plan must cite design.md, and the acceptance
  # auditor keys its traceability matrix off the D-/M- screen ids.
  after_clarify:
    - extension: brainbuddy-pipeline
      command: speckit.design
      optional: false
      description: "Produce the UX/UI design and the numbered screen+state inventory."
      prompt: >-
        The spec and its Clarifications are settled. Produce design.md and the
        static HTML screens before planning, so the technical plan can cite
        real screens and states.

  # The review gate. Runs after the technical plan exists, because three of the
  # five lenses cannot judge a spec without it.
  after_plan:
    - extension: brainbuddy-pipeline
      command: speckit.review
      optional: false
      description: "Run the five-lens spec review gate and print the verdict."
      prompt: >-
        Run the portable spec review gate (ADR-0011). Implementation must not
        start until the aggregated verdict is approved or founder-accepted.

  # Advisory until an implementation exists to accept. /speckit-accept refuses
  # to grade an unimplemented feature, so leaving this optional costs nothing
  # and makes the stage discoverable.
  after_tasks:
    - extension: brainbuddy-pipeline
      command: speckit.accept
      optional: true
      description: "Grade the delivered feature against its spec once it is built."
      prompt: >-
        After implementation and verification are green, run /speckit-accept to
        build the traceability matrix and issue the accept/reject verdict.

  after_analyze:
    - extension: brainbuddy-pipeline
      command: speckit.report
      optional: true
      description: "Render the end-to-end run report for the human."
      prompt: >-
        Run /speckit-report to aggregate intake, spec, design, plan, every
        reviewer verdict, verification results and the acceptance verdict into
        one report for the human.
