# BrainBuddy first-party hooks around the Spec Kit core.
# The generic integration under .specify/agent-commands/ is canonical: no
# vendor CLI is needed to author specs. Mandatory stages must be executed by
# the active agent before moving on, using the command's SKILL.md file.
# assess is deliberately unhooked: stage 0 is optional, and its kill verdict
# is enforced by the interview stage. Do not turn assessment into a mandatory
# cost for every small feature.
# `specify extension update` rewrites this file and strips comments. Restore
# this header after updating the extension and verify the actual hook values.
hooks:
  before_specify:
  - extension: brainbuddy-pipeline
    command: speckit.interview
    optional: true
    description: Elicit business requirements from the human before writing the spec.
    prompt: No intake.md exists for this feature. Run /speckit-interview first to
      capture the problem, persona, business objective, scope boundary, non-goals,
      constraints and definition of done, then let it call /speckit-specify with the
      agreed description.
  after_clarify:
  - extension: brainbuddy-pipeline
    command: speckit.design
    optional: false
    description: Produce the UX/UI design and the numbered screen+state inventory.
    prompt: The spec and its Clarifications are settled. Produce design.md and the
      static HTML screens before planning, so the technical plan can cite real screens
      and states.
  after_plan:
  - extension: brainbuddy-pipeline
    command: speckit.review
    optional: false
    description: Run the five-lens spec review gate and print the verdict.
    prompt: Run the portable spec review gate (ADR-0011). Implementation must not
      start until the aggregated verdict is approved or founder-accepted.
  after_tasks:
  - extension: brainbuddy-pipeline
    command: speckit.accept
    optional: true
    description: Grade the delivered feature against its spec once it is built.
    prompt: After implementation and verification are green, run /speckit-accept to
      build the traceability matrix and issue the accept/reject verdict.
  after_analyze:
  - extension: brainbuddy-pipeline
    command: speckit.report
    optional: true
    description: Render the end-to-end run report for the human.
    prompt: Run /speckit-report to aggregate intake, spec, design, plan, every reviewer
      verdict, verification results and the acceptance verdict into one report for
      the human.
installed:
- assess
settings:
  auto_execute_hooks: true
