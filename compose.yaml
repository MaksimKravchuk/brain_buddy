services:
  backend:
    # Naming the image explicitly lets a caller build it once, ahead of time,
    # and have Compose start that exact image instead of rebuilding it. Without
    # this the tag is derived from the Compose project name, which the E2E
    # runner generates per run and therefore cannot be prebuilt against.
    image: ${BRAIN_BUDDY_BACKEND_IMAGE:-brain-buddy-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BRAIN_BUDDY_ENV: ${BRAIN_BUDDY_ENV:-production}
      BRAIN_BUDDY_DATA_DIR: ${BRAIN_BUDDY_DATA_DIR:-/app/data}
      BRAIN_BUDDY_API_PREFIX: ${BRAIN_BUDDY_API_PREFIX:-/api}
      BRAIN_BUDDY_ENABLE_VOICE_SWEEP_IN_TEST: ${BRAIN_BUDDY_ENABLE_VOICE_SWEEP_IN_TEST:-0}
      BRAIN_BUDDY_VOICE_SWEEP_INTERVAL_SECONDS: ${BRAIN_BUDDY_VOICE_SWEEP_INTERVAL_SECONDS:-60}
      BRAIN_BUDDY_AGENT_RETENTION_SWEEP_INTERVAL_SECONDS: ${BRAIN_BUDDY_AGENT_RETENTION_SWEEP_INTERVAL_SECONDS:-60}
      BRAIN_BUDDY_VOICE_RECONCILER_PROVIDER: ${BRAIN_BUDDY_VOICE_RECONCILER_PROVIDER:-disabled}
      BRAIN_BUDDY_FEATURE_FLAGS: ${BRAIN_BUDDY_FEATURE_FLAGS:-}
      BRAIN_BUDDY_ADMIN_EMAIL: ${BRAIN_BUDDY_ADMIN_EMAIL:-}
      BRAIN_BUDDY_ADMIN_PASSWORD: ${BRAIN_BUDDY_ADMIN_PASSWORD:-}
      BRAIN_BUDDY_ADMIN_OPERATOR_EMAILS: ${BRAIN_BUDDY_ADMIN_OPERATOR_EMAILS:-}
      # The relay's E2E fixtures live on this Compose network, which is a
      # private address range. The opt-in is per-deployment and governed
      # (014-FR-004); production leaves it unset and the destination check
      # refuses every private address.
      BRAIN_BUDDY_AGENT_ALLOW_PRIVATE_DESTINATIONS: ${BRAIN_BUDDY_AGENT_ALLOW_PRIVATE_DESTINATIONS:-0}
      # The origin the per-run A2A push callback is built from. It is part of
      # the manifest token, so a stack that moved cannot let a stale
      # confirmation hand an agent an address BrainBuddy no longer answers on.
      BRAIN_BUDDY_PUBLIC_BASE_URL: ${BRAIN_BUDDY_PUBLIC_BASE_URL:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "${BRAIN_BUDDY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ${BRAIN_BUDDY_FRONTEND_IMAGE:-brain-buddy-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    env_file:
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # --- external agent relay E2E fixtures (profile: agents) ------------------
  #
  # Both are *reference runtimes*, not doubles: the point of running them is
  # that nobody adapted them to BrainBuddy (014-FR-017, 014-SC-001). They are
  # behind a profile so an ordinary `docker compose up` does not start two
  # agents nobody asked for.

  a2a-helloworld:
    profiles: ["agents"]
    image: ${BRAIN_BUDDY_A2A_HELLOWORLD_IMAGE:-brain-buddy-a2a-helloworld:local}
    build:
      context: .
      dockerfile: scripts/fixtures/a2a-helloworld/Dockerfile
    # The sample hard-codes `127.0.0.1:9999`, so it is only reachable from
    # inside the namespace it binds in. Joining the backend's namespace is what
    # makes `http://127.0.0.1:9999` a real address for the backend without
    # editing a single line of the vendored sample.
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy

  hermes-a2a:
    profiles: ["agents"]
    image: ${BRAIN_BUDDY_HERMES_A2A_IMAGE:-brain-buddy-hermes-a2a:local}
    build:
      context: .
      dockerfile: scripts/fixtures/hermes-a2a/Dockerfile
    environment:
      A2A_HOST: "0.0.0.0"
      A2A_PORT: "9900"
      # Without a token the adapter refuses to bind anywhere but loopback, so
      # this is what makes the fixture reachable as a Compose service at all.
      A2A_BEARER_TOKEN: ${BRAIN_BUDDY_HERMES_A2A_TOKEN:-hermes-e2e-bearer-token}
      # The card advertises the address the *backend* can reach, which is the
      # service name — not this container's bind host.
      A2A_PUBLIC_URL: http://hermes-a2a:9900/
      STUB_REPLY_DELAY_SECONDS: ${BRAIN_BUDDY_HERMES_A2A_DELAY_SECONDS:-0}
    expose:
      - "9900"

volumes:
  backend-data:
    driver: local
