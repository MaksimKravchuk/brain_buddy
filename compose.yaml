services:
  backend:
    # Naming the image explicitly lets a caller build it once, ahead of time,
    # and have Compose start that exact image instead of rebuilding it. Without
    # this the tag is derived from the Compose project name, which the E2E
    # runner generates per run and therefore cannot be prebuilt against.
    image: ${BRAIN_BUDDY_BACKEND_IMAGE:-brain-buddy-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BRAIN_BUDDY_ENV: ${BRAIN_BUDDY_ENV:-production}
      BRAIN_BUDDY_DATA_DIR: ${BRAIN_BUDDY_DATA_DIR:-/app/data}
      BRAIN_BUDDY_API_PREFIX: ${BRAIN_BUDDY_API_PREFIX:-/api}
      BRAIN_BUDDY_ENABLE_VOICE_SWEEP_IN_TEST: ${BRAIN_BUDDY_ENABLE_VOICE_SWEEP_IN_TEST:-0}
      BRAIN_BUDDY_VOICE_SWEEP_INTERVAL_SECONDS: ${BRAIN_BUDDY_VOICE_SWEEP_INTERVAL_SECONDS:-60}
      BRAIN_BUDDY_AGENT_RETENTION_SWEEP_INTERVAL_SECONDS: ${BRAIN_BUDDY_AGENT_RETENTION_SWEEP_INTERVAL_SECONDS:-60}
      BRAIN_BUDDY_VOICE_RECONCILER_PROVIDER: ${BRAIN_BUDDY_VOICE_RECONCILER_PROVIDER:-disabled}
      BRAIN_BUDDY_FEATURE_FLAGS: ${BRAIN_BUDDY_FEATURE_FLAGS:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "${BRAIN_BUDDY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ${BRAIN_BUDDY_FRONTEND_IMAGE:-brain-buddy-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    env_file:
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  backend-data:
    driver: local
