# $uri is normalized and query-free. Match auth/account segments regardless of
# the configured API prefix, and preserve existing unrelated request targets.
map $uri $auth_safe_uri {
    default $request_uri;
    # nginx decodes once. A remaining escape may conceal an auth segment or
    # query delimiter; stock nginx cannot decode it again for classification.
    "~%[0-9A-Fa-f]{2}" [redacted];
    ~^(?<push_prefix>.*?/a2a/push/)(?<push_run>[^/]+)/.+ $push_prefix$push_run/[redacted];
    "~*^(?<auth_path>[^?#]*/(?:auth|account)(?:/[^?#]*)?)(?:[?#].*)?$" $auth_path;
}

log_format auth_safe '$remote_addr - - [$time_local] '
                     '"$request_method $auth_log_target $server_protocol" '
                     '$status $body_bytes_sent request_id=$request_id';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout auth_safe;
    # Native nginx error logs include unredactable request/upstream URLs.
    # Safe access status/request_id and backend coarse failures retain evidence.
    error_log /dev/null;
    # Evaluate the cached map before SPA try_files rewrites $uri to index.html.
    set $auth_log_target $auth_safe_uri;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /assets/ {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
