[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "brain-buddy-backend"
version = "0.1.0"
description = "Brain Buddy backend service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Brain Buddy Team" }
]
dependencies = [
  "av>=12,<19",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<0.53",
  "pydantic>=2.6,<3.0",
  "httpx>=0.25,<0.29",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.9,<1.0",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=4.1,<8.0",
  "black>=24.3,<27.0",
  "ruff>=0.16,<0.17",
  "mypy>=1.8,<3.0",
  "allure-pytest>=2.15,<3.0",
  "hypothesis>=6.0,<7.0",
  "import-linter>=2.0,<3.0",
  "schemathesis>=3.34,<5.0",
  "mutmut>=3.6,<4.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "C4", "PIE", "SIM",
  # Security (this is flake8-bandit; it is the backend's SAST pass).
  "S",
  # Async correctness -- blocking calls inside async def, which in a FastAPI
  # app stalls the event loop rather than failing loudly.
  "ASYNC",
  # Complexity ceilings, see the mccabe/pylint sections below.
  "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  # Naive datetimes, logging call shape, banned/relative imports,
  # commented-out code, and the non-opinionated pylint halves.
  "DTZ", "LOG", "G", "TID", "ERA", "PLC", "PLE",
]
ignore = [
  "E501",
  "B008",
  # Type-narrowing asserts after a closure assigns through mutate_tree. These
  # are for the type checker, not runtime validation, so `python -O` stripping
  # them is harmless.
  "S101",
  # `class X(str, Enum)` -> `StrEnum` is not mechanical: StrEnum's __str__
  # returns the value where str+Enum returns "Class.MEMBER". These enums are
  # serialised, so migrating is a behavioural change to make deliberately.
  "UP042",
]

# Ceilings set to the current worst function in `app`, so nothing fails today
# and nothing may get worse. Lower them as the outliers are refactored -- the
# same ratchet idea applied to complexity rather than coverage.
[tool.ruff.lint.mccabe]
max-complexity = 23

[tool.ruff.lint.pylint]
max-args = 16
max-branches = 20
max-statements = 92
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# Test-idiomatic patterns that the security and import rules flag by design:
# asserts are the point, the "passwords" are fixture constants, imports are
# deferred inside tests to keep module import order under the fixtures'
# control, table names in purge assertions are literals, and naive datetimes
# are deliberate fixture data.
"tests/*" = ["S101", "S105", "S106", "S608", "PLC0415", "DTZ001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

# Architectural fitness functions. The layering in CLAUDE.md held by
# convention alone; these contracts make it machine-checkable so it cannot be
# eroded one plausible-looking import at a time. Run via `lint-imports`.
[tool.importlinter]
root_package = "app"
# Required so the framework-independence contract below can name fastapi and
# starlette, which live outside the root package.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routes depend on services, services on repositories, never the reverse"
type = "layers"
layers = ["app.api", "app.services", "app.repositories"]
exhaustive = false

# A layers contract only forbids importing *upwards*, so it would still permit a
# route reaching straight past the service layer into storage. That shortcut is
# the usual way layering dies, so it needs its own forbidden contract.
[[tool.importlinter.contracts]]
name = "Routes reach storage only through a service"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = [
  "app.repositories",
  "app.modules.tasks.repository",
  "app.workflows.voice_brain_dump.repository",
]
# Only a direct route-to-repository import is the shortcut worth failing on.
# Reaching storage transitively through a service, or through the container,
# is the intended path.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The tasks module keeps its own service-over-repository layering"
type = "layers"
layers = ["app.modules.tasks.service", "app.modules.tasks.repository"]

[[tool.importlinter.contracts]]
name = "The voice brain-dump workflow keeps its own service-over-repository layering"
type = "layers"
layers = [
  "app.workflows.voice_brain_dump.service",
  "app.workflows.voice_brain_dump.repository",
]

# Domain code stays framework-independent: only the API layer, the composition
# root, and the CLI may know about FastAPI. This is what keeps services and
# repositories unit-testable without an ASGI fixture -- which mutation testing
# depends on, since ASGI fixtures cannot run under mutmut (ADR-0004).
[[tool.importlinter.contracts]]
name = "Domain layers do not import the web framework"
type = "forbidden"
source_modules = [
  "app.services",
  "app.repositories",
  "app.modules",
  "app.workflows",
  "app.ai",
]
forbidden_modules = ["fastapi", "starlette"]

[tool.pytest.ini_options]
addopts = "-ra --alluredir=allure-results --cov=app --cov-branch --cov-fail-under=95 --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["app"]
# This is the OBSERVED scope (ADR-0011): everything the nightly report-only
# campaign mutates. The ENFORCED scope that gates pull requests is narrower and
# is configured with the gate itself; a module graduates from the first list to
# the second only after clearing ADR-0004's 95% bar on its own.
#
# The task repository and auth service are here under calibration. Their
# measured score at the time of admission was 68.3% (879 mutants, 279
# survivors), so they are deliberately not gating anything yet.
only_mutate = [
  "app/modules/tasks/repository.py",
  "app/services/auth_service.py",
  "app/services/tree_service.py",
  "app/services/version_service.py",
  "app/services/relation_service.py",
  "app/repositories/tree.py",
  "app/repositories/version.py",
  "app/repositories/index.py",
]
pytest_add_cli_args_test_selection = [
  # Task module and auth: non-ASGI only. The HTTP-level suites cover the same
  # behaviour but cannot run under mutmut's stack-statistics instrumentation.
  "tests/test_task_owner_isolation.py",
  "tests/test_task_branch_coverage.py",
  "tests/test_auth_service.py",
  "tests/test_tree_service.py",
  "tests/test_relation_service.py",
  "tests/test_version_service.py",
  "tests/test_version_repository.py",
  "tests/test_index_repository.py",
  "tests/test_property_invariants.py",
  "tests/test_service_edge_cases.py",
  "tests/test_branch_invariants.py",
  "tests/test_repository_and_cli_edges.py",
  "tests/test_node_service.py",
  "tests/test_mutation_survivor_exact.py",
]
pytest_add_cli_args = ["-c", "mutmut_pytest.ini"]
also_copy = ["mutmut_pytest.ini"]
mutate_only_covered_lines = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "pyproject.toml"]
