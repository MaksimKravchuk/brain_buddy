[package]
name = "brainbuddy-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "BrainBuddy command line for people and AI agents"
publish = false

[[bin]]
name = "bb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
directories = "6.0"
webbrowser = "1.2"
ctrlc = "3.5"
zeroize = { version = "1.9", features = ["derive"] }
sha2 = "0.10"
httpdate = "1.0"
getrandom = "0.4"
cookie = "0.18"
time = { version = "0.3", features = ["parsing", "formatting"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
dbus-secret-service = { version = "4.1", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
