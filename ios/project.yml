# XcodeGen spec for the native iOS app (docs/native-ios-app.md).
#
#   cd ios && xcodegen generate && open BrainBuddy.xcodeproj
#
# BrainBuddy.xcodeproj, both Info.plists and both .entitlements files are
# written from this file on every `xcodegen generate` and are not committed.
# Change them here, never in Xcode's editors.
name: BrainBuddy

options:
  minimumXcodeGenVersion: 2.42.0
  # Fallback only, for a target without its own PRODUCT_BUNDLE_IDENTIFIER.
  # The shipping targets derive theirs from BB_BUNDLE_ID_PREFIX below.
  bundleIdPrefix: brainbuddy
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: en

packages:
  # BrainBuddyCore links the shared Rust core (spec 026) as a static XCFramework that is
  # built, not committed: run `sh scripts/build-rust-bridge.sh apple` before resolving this
  # package. The app and the widget extension both get it through BrainBuddyCore (the
  # products below), so neither target lists it; ios/AGENTS.md, "Rust bridge".
  BrainBuddyKit:
    path: BrainBuddyKit

# Project-level, so the app and its widget extension can never disagree on
# identifiers, signing, version or language mode.
settings:
  base:
    # Every identifier derives from this prefix: the app `<prefix>.ios`, the
    # widgets `<prefix>.ios.widgets`, the App Group `group.<prefix>.ios` and
    # the background refresh task `<prefix>.ios.refresh`. Code reads the App
    # Group from the BBAppGroupIdentifier Info.plist key and the refresh id
    # from the bundle id, so this line is the only place to change it. CI
    # overrides it on the xcodebuild command line from vars.IOS_BUNDLE_ID_PREFIX.
    BB_BUNDLE_ID_PREFIX: brainbuddy
    BB_APP_GROUP_ID: group.$(BB_BUNDLE_ID_PREFIX).ios
    # Deliberately empty. Choose your team in Xcode (Signing & Capabilities) or
    # pass DEVELOPMENT_TEAM=<team id> to xcodebuild; CI passes vars.APPLE_TEAM_ID.
    # See README.md, "Signing and identifiers".
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The extension's version and build must equal the app's, or App Store
    # Connect rejects the upload. CI overrides CURRENT_PROJECT_VERSION.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # "<branch> @ <commit>" for TestFlight uploads, set by ios.yml and shown in
    # Settings → About; empty for local builds, which hides the row.
    BB_BUILD_LABEL: ""
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES

targets:
  BrainBuddy:
    type: application
    platform: iOS
    sources:
      # Includes BrainBuddy/Resources (asset catalog). The generated Info.plist
      # and .entitlements there are never added to a build phase.
      - path: BrainBuddy
      # Compiled into both the app and the widget extension. Its resources
      # (PrivacyInfo.xcprivacy) ship in both bundles.
      - path: Shared
    dependencies:
      - package: BrainBuddyKit
        products:
          - BrainBuddyWorkspace
          - BrainBuddyCore
          - BrainBuddyDiagnostics
      - target: BrainBuddyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BB_BUNDLE_ID_PREFIX).ios
        # Set per target on purpose: XcodeGen's iOS presets are applied at the
        # target level and would shadow a project-level value.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Beta performance diagnostics (App/PerformanceDiagnostics.swift,
        # README.md "Performance diagnostics"): YES while the app ships only
        # through TestFlight. Set NO before the first App Store release; with
        # NO nothing is recorded and Settings shows no Performance row.
        BB_PERFORMANCE_DIAGNOSTICS: "YES"
      # The weekly review's account-less release switch (spec 020,
      # contracts/ios-commands.md §8). Account-less auto-parks have no server
      # and no remote kill switch, so Release (TestFlight, App Store) keeps it
      # NO until the owner records the decision to turn it on (PR-14); Debug
      # builds use it for account-less acceptance. Signed in, the account's
      # `weekly_review` flag decides instead.
      configs:
        Debug:
          BB_WEEKLY_REVIEW_LOCAL: "YES"
        Release:
          BB_WEEKLY_REVIEW_LOCAL: "NO"
    info:
      path: BrainBuddy/Resources/Info.plist
      properties:
        CFBundleDisplayName: Brain Buddy
        UIAppFonts:
          - GoogleSans-Medium.ttf
        # Read by ReviewExposure.accountlessReleaseSwitch (App/RootView.swift).
        BBWeeklyReviewLocal: $(BB_WEEKLY_REVIEW_LOCAL)
        # Read by PerformanceDiagnostics.isEnabled.
        BBPerformanceDiagnostics: $(BB_PERFORMANCE_DIAGNOSTICS)
        # XcodeGen's defaults are literal "1.0" / "1"; tie both to build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        BBAppGroupIdentifier: $(BB_APP_GROUP_ID)
        BBBuildLabel: $(BB_BUILD_LABEL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - brainbuddy
        # Registered in code as Bundle.main.bundleIdentifier + ".refresh".
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        UIBackgroundModes:
          - fetch
        # No App Transport Security exceptions, in any configuration: https
        # everywhere. The client refuses plain http except to localhost, and a
        # development server at http://localhost still works because ATS
        # allows unqualified host names by default. Literal loopback addresses
        # (127.0.0.1, [::1]) are blocked by ATS since iOS 17; use `localhost`.
        # Don't add NSAllowsLocalNetworking back: a `$(SETTING)` in the plist
        # becomes a string, so it can't be made Debug-only here, and Release
        # must not carry it.
        # HTTPS only (exempt), so TestFlight skips the export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: BrainBuddy/Resources/BrainBuddy.entitlements
      properties:
        # The one shared store (docs/native-ios-app.md, "Persistence and
        # extensions"). No keychain sharing: extensions never sync, so they
        # never need the session.
        com.apple.security.application-groups:
          - $(BB_APP_GROUP_ID)
        com.apple.developer.applesignin:
          - Default

  BrainBuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BrainBuddyWidgets
      - path: Shared
    dependencies:
      - package: BrainBuddyKit
        products:
          - BrainBuddyWorkspace
          - BrainBuddyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BB_BUNDLE_ID_PREFIX).ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # An embedded extension must not install on its own, or `xcodebuild
        # archive` produces a generic archive that cannot go to TestFlight.
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    info:
      path: BrainBuddyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Brain Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BBAppGroupIdentifier: $(BB_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BrainBuddyWidgets/BrainBuddyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(BB_APP_GROUP_ID)

schemes:
  BrainBuddy:
    build:
      targets:
        BrainBuddy: all
        BrainBuddyWidgets: all
    run:
      config: Debug
      executable: BrainBuddy
    test:
      config: Debug
      # The package's Swift Testing targets, run on the chosen iOS Simulator:
      #   xcodebuild test -scheme BrainBuddy \
      #     -destination 'platform=iOS Simulator,name=iPhone 17'
      # CI runs the same targets with `swift test` on Linux and macOS.
      targets:
        - package: BrainBuddyKit/BrainBuddyCoreTests
        - package: BrainBuddyKit/BrainBuddyPersistenceTests
        - package: BrainBuddyKit/BrainBuddyAPITests
        - package: BrainBuddyKit/BrainBuddySyncTests
        - package: BrainBuddyKit/BrainBuddyWorkspaceTests
        - package: BrainBuddyKit/BrainBuddyDiagnosticsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
